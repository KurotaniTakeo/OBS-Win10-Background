name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        run: npm run build

      - name: Verify build output
        run: |
          if (Test-Path "dist/obs-config-server.exe") {
            Write-Host "Build successful: dist/obs-config-server.exe exists"
          } else {
            Write-Error "Build failed: exe not found"
            exit 1
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/obs-config-server.exe
          generate_release_notes: true
          draft: false
          prerelease: false
